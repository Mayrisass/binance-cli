[package]
name = "binance-gateway"
version = "0.1.0"
edition = "2024"
description = "API gateway (auth, signature verification, rate limiting) in front of the Market, Trading, Transaction, Wallet and DeFi APIs"
publish = false

[lib]
name = "binance_gateway"
path = "src/lib.rs"

[[bin]]
name = "binance-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
